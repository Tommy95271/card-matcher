name: 💳 信用卡查詢系統 CI/CD 自動化同步與佈署

on:
  push:
    branches:
      - main
  schedule:
    # 每月 1 號清晨 04:00 (UTC 20:00) 自動同步 Notion 最新資料並更新佈署
    - cron: '0 20 1 * *'
  workflow_dispatch: # 支援手動在 GitHub 後台一鍵點擊執行

# 設定 GitHub Pages 發布權限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安裝專案依賴
        run: npm ci

      - name: 🔄 自動從 Notion 同步最新店家與消費資料 (若有設定 Secret)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_EXPENSES_DB_ID: ${{ secrets.NOTION_EXPENSES_DB_ID }}
        run: |
          if [ -n "$NOTION_API_KEY" ] && [ -n "$NOTION_DATABASE_ID" ]; then
            echo "正在同步 Notion 特約店家資料庫..."
            node scripts/sync-notion.js
          fi
          if [ -n "$NOTION_API_KEY" ] && [ -n "$NOTION_EXPENSES_DB_ID" ]; then
            echo "正在同步 Notion 刷卡記帳資料庫..."
            node scripts/sync-expenses.js
          fi

      - name: 🏗️ 建置前端靜態網頁
        run: npm run build

      - name: 🚀 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 上傳建置產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🌐 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
