name: 🚀 部署至 Firebase Hosting (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出程式碼庫 (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安裝專案依賴
        run: npm ci

      - name: 🏗️ 建置前端靜態網頁 (Build)
        run: npm run build

      - name: 🚀 發布至 Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARD_MATCHER_2026 }}'
          channelId: live
          projectId: card-matcher-2026
