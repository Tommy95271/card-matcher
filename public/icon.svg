
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d111d"/>
      <stop offset="50%" stop-color="#181e36"/>
      <stop offset="100%" stop-color="#241442"/>
    </linearGradient>

    <!-- 卡片本體漸層 (極致高光白銀金屬) -->
    <linearGradient id="cardGrad" x1="60" y1="120" x2="440" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>

    <!-- 晶片金色漸層 -->
    <linearGradient id="goldChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- 晶片陰影 -->
    <filter id="chipShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- 霓虹光暈 -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 滿版背景 (iOS Apple Touch Icon 專用) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 裝飾微光線條 -->
  <circle cx="256" cy="256" r="230" stroke="#6366f1" stroke-width="2" stroke-opacity="0.2" fill="none"/>

  <!-- 主體卡片 (傾斜 -7 度帶奢華陰影) -->
  <g transform="rotate(-7 256 256)">
    <!-- 卡片外殼 -->
    <rect x="76" y="146" width="360" height="220" rx="24" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
    
    <!-- 頂部反光邊框 -->
    <rect x="77" y="147" width="358" height="218" rx="23" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" fill="none"/>

    <!-- 深色磁條 -->
    <rect x="76" y="196" width="360" height="42" fill="#0f172a" fill-opacity="0.9"/>

    <!-- 金色 EMV 晶片 -->
    <g filter="url(#chipShadow)">
      <rect x="116" y="260" width="70" height="54" rx="8" fill="url(#goldChip)"/>
      <rect x="116" y="260" width="70" height="54" rx="8" stroke="#A16207" stroke-width="1.5" fill="none"/>
      <!-- 晶片微線路 -->
      <line x1="116" y1="287" x2="186" y2="287" stroke="#854d0e" stroke-width="1.5"/>
      <line x1="151" y1="260" x2="151" y2="314" stroke="#854d0e" stroke-width="1.5"/>
      <circle cx="151" cy="287" r="8" fill="#eab308" stroke="#854d0e" stroke-width="1.5"/>
    </g>

    <!-- NFC 感應圖示 (電光藍) -->
    <g transform="translate(370, 275)" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M0,24 A26,26 0 0,0 0,-4" stroke-opacity="0.95"/>
      <path d="M-7,19 A18,18 0 0,0 -7,1" stroke-opacity="0.85"/>
      <path d="M-14,14 A10,10 0 0,0 -14,6" stroke-opacity="0.75"/>
    </g>

    <!-- 底部卡號裝飾點 -->
    <g fill="#64748B" opacity="0.6">
      <circle cx="120" cy="342" r="3.5"/>
      <circle cx="132" cy="342" r="3.5"/>
      <circle cx="144" cy="342" r="3.5"/>
      <circle cx="156" cy="342" r="3.5"/>
      
      <circle cx="178" cy="342" r="3.5"/>
      <circle cx="190" cy="342" r="3.5"/>
      <circle cx="202" cy="342" r="3.5"/>
      <circle cx="214" cy="342" r="3.5"/>

      <circle cx="236" cy="342" r="3.5"/>
      <circle cx="248" cy="342" r="3.5"/>
      <circle cx="260" cy="342" r="3.5"/>
      <circle cx="272" cy="342" r="3.5"/>

      <text x="296" y="347" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#334155">2026</text>
    </g>
  </g>

  <!-- 右上角四角星芒高光 (Sparkle) -->
  <g transform="translate(416, 96) scale(1.2)">
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#FDE047"/>
  </g>
</svg>
